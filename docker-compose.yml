services:
  candlr:
    image: bellamy/candlr:latest
    container_name: candlr
    restart: unless-stopped
    ports:
      - "4258:4258"
    environment:
      - PUID=1000
      - PGID=1000
      - SECRET_KEY=change-me-generate-a-random-string  # REQUIRED: replace with `openssl rand -hex 32`
      - COOKIE_SECURE=false  # set to true when serving over HTTPS
      - DOCS_ENABLED=false   # set to true to expose /docs and /redoc
      - TIMEZONE=America/New_York  # IANA name; defaults to UTC. Determines "today" for the dashboard and reminders.

      # Registrations are disabled by default. Set to true to allow additional
      # users beyond the very first one, which can always sign up.
      # - ENABLE_REGISTRATIONS=true
      # - REGISTRATION_MAX_ALLOWED_USERS=0  # 0 = unlimited

      # OIDC / SSO (optional)
      # - OIDC_ENABLED=true
      # - OIDC_PROVIDER_NAME=SSO
      # - OIDC_CLIENT_ID=
      # - OIDC_CLIENT_SECRET=
      # - OIDC_AUTH_URL=
      # - OIDC_TOKEN_URL=
      # - OIDC_USERINFO_URL=
      # - OIDC_REDIRECT_URL=http://your-server:4258/oidc-callback
      # - OIDC_IDENTIFIER_FIELD=email
      # - OIDC_SCOPES=openid email profile
      # - OIDC_AUTO_CREATE_USERS=true
      # - OIDC_DISABLE_PASSWORD_LOGIN=false

      # SMTP (optional) - powers the email notification channel and, once
      # set, turns on forgot/reset password.
      # - SERVER_URL=http://your-server:4258  # used to build the reset-password link
      # - SMTP_ADDRESS=
      # - SMTP_PORT=587
      # - SMTP_ENCRYPTION=tls  # tls, ssl, or none
      # - SMTP_USERNAME=
      # - SMTP_PASSWORD=
      # - FROM_EMAIL=

      # Web push (optional) - device notifications. Generate a pair with:
      # docker exec candlr python3 /app/backend/scripts/generate_vapid_keys.py
      # - VAPID_PUBLIC_KEY=
      # - VAPID_PRIVATE_KEY=
      # - VAPID_SUBJECT=mailto:admin@example.com
    volumes:
      - ./data:/app/backend/data
